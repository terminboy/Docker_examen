{% extends "base.html" %}

{% block title %}{{ city.name }}{% endblock %}

{% block content %}
<section class="detail-card">
    <h2>{{ city.name }}</h2>
    <p><strong>Страна:</strong> {{ country.name }}</p>
    <p><strong>Население:</strong> {{ city.population }}</p>
    <a href="/countries/{{ country.id }}/cities">Другие города страны</a>
</section>
{% endblock %}
